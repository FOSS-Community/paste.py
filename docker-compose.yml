services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres15
    restart: unless-stopped
    environment:
      POSTGRES_DB: pastedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mytestpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pastedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.89
    container_name: rustfs
    restart: unless-stopped
    user: root
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Console UI
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_VOLUMES=/data{1...4}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin123
    volumes:
      - data1:/data1
      - data2:/data2
      - data3:/data3
      - data4:/data4
  #    healthcheck:
  #      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #      interval: 30s
  #      timeout: 10s
  #      retries: 5
  #      start_period: 20s

  myapp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MINIO_CLIENT_LINK: http://rustfs:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: pastebucket
      BASE_URL: http://127.0.0.1:8082
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:mytestpassword@postgres:5432/pastedb
    ports:
      - "8082:8080"
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["pdm", "run", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  data1:
  data2:
  data3:
  data4:
